<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sail Controls | San Juan Academy</title>

<meta name="description" content="Learn, practice, and master dinghy sail controls. Understand what each control does, how it changes the sail, and when to use it.">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <style>
    body { 
      background-color: #f0f4f8; 
    }
    .tutorial-card { 
      max-width: 1000px; 
      margin: 5px auto; 
    }
    /* FIX: Force an absolute bounded graphic workspace zone to stop clipping */
    .fixed-canvas-box { 
      height: 240px; 
      width: 100%;
      background: white; 
      border: 1px solid #dee2e6; 
      border-radius: 6px; 
      padding: 10px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-dot { 
      width: 12px; 
      height: 12px; 
      border-radius: 50%; 
      background-color: #cbd5e0; 
      display: inline-block; 
      margin: 0 4px; 
    }
    .step-dot.active { 
      background-color: #0d6efd; 
    }
  </style>
     	<!-- 2. Your Personal Custom CSS Last (Overrides everything above safely) -->
  	<link rel="stylesheet" href="css/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">

</head>
<body>
    <div style="background-color: var(--nav-bg); color: var(--text-color); padding: 1rem;">
    <h2>SJ Academy - Sail Controls</h2>
    </div>		
    <div class="container my-4" style="max-width: 1200px;">
    <div class="card-body" style="padding-left: 6px; padding-right: 6px;">
        
        <!-- ======================================================== -->
        <!--  VISUALIZATION ZONE (DYNAMIC CANVAS MUTATION TRACK)      -->
        <!-- ======================================================== -->
            
            <!-- VIEW C: Rig Profile (Visible for Vang & Downhaul Mast Bending) -->
            <div id="viewRig" class="sandbox-view">
            <h6 class="text-secondary fw-bold mb-2">Rig Profile Tension (Side View Mast Bend)</h6>
            <div class="canvas-wrapper rounded border">
                <svg viewBox="0 0 200 160" width="50%" height="100%">
                <line x1="30" y1="145" x2="180" y2="145" stroke="#cbd5e0" stroke-width="2" />
                <!-- Mast Component (Targeted via Path for bending curves) -->
                <path id="mastProfilePath" d="M 50,145 Q 50,75 50,15" fill="none" stroke="#4a5568" stroke-width="4" stroke-linecap="round"/>
                <line id="profileBoomLine" x1="50" y1="125" x2="150" y2="125" stroke="#4a5568" stroke-width="3" />
                <path id="sailProfileCurvePath" d="M 50,125 Q 75,70 50,20" fill="none" stroke="#3182ce" stroke-width="4" stroke-linecap="round" />
                </svg>
            </div>
        </div>
    </div>
    </div>

    <!-- Control Selector -->
    <div id="controlSelector" style="flex: 1;">
        <h6>&nbsp;Control Selector</h6>

        <div class="controlSelector"
            style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
        <label>
            <input type="radio" name="inputControl" value="4" checked>
            Vang
        </label>

        <label>
            <input type="radio" name="inputControl" value="5">
            Downhaul
        </label>

        </div>
    </div>

    <!-- Input Control -->
    <div id="input-pane" style="flex: 2;">
        <!-- Vang -->
        <div id="vangControl" class="input-section active">

        <div class="control-column">

            <h6>&nbsp;Vang</h6>

            <button class="control-button"
                    data-control="vang"
                    data-value="Max"
                    onclick="updateVangControl('Max', this)">
            MAX
            </button>

            <button class="control-button"
                    data-control="vang"
                    data-value="Center"
                    onclick="updateVangControl('Center', this)">
            CENTER
            </button>

            <button class="control-button"
                    data-control="vang"
                    data-value="Ease"
                    onclick="updateVangControl('Ease', this)">
            EASE
            </button>

        </div>

        </div>
        <!-- Downhaul -->
        <div id="downhaulControl" class="input-section">

        <div class="control-column">

            <h6>&nbsp;Downhaul</h6>

            <button class="control-button"
                    data-control="downhaul"
                    data-value="Max Luff"
                    onclick="updateDownhaulControl('Max Luff', this)">
            MAX LUFF
            </button>

            <button class="control-button"
                    data-control="downhaul"
                    data-value="Base"
                    onclick="updateDownhaulControl('Base', this)">
            BASE
            </button>

            <button class="control-button"
                    data-control="downhaul"
                    data-value="Off"
                    onclick="updateDownhaulControl('Off', this)">
            OFF
            </button>

        </div>

        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center">
    <a href="practice1.html" class="btn btn-outline-secondary">
        ← Back to Practice 1
    </a>

    <a href="challenge.html" class="btn btn-primary">
        Proceed to Challenge →
    </a>
    </div>

    <!-- Footer -->
    <footer class="border-top mt-5 py-1">
    <div class="container text-center">
    <p class="mb-1">
        <strong>Dinghy Sailing Tutorial</strong>
    </p>
    <small class="text-body-secondary">
        Learn • Practice • Challenge
    </small>
    </div>
    </footer>

    <script>
    // ---------------------------------------------------------
    // CONTROL SELECTOR
    // ---------------------------------------------------------

    const controlSelector = document.getElementById("controlSelector");

    if (controlSelector) {

        controlSelector.addEventListener("change", function(event) {

        const selectedValue = event.target.value;

        // Hide all input sections
        document.querySelectorAll(".input-section").forEach(section => {
            section.classList.remove("active");
        });

        // Show the selected input section
        switch (selectedValue) {

            case "4":
            document.getElementById("vangControl").classList.add("active");
            break;

            case "5":
            document.getElementById("downhaulControl").classList.add("active");
            break;
        }

        });

    }


    // ---------------------------------------------------------
    // CONTROL BUTTON HIGHLIGHTS
    // ---------------------------------------------------------

    document.addEventListener("click", function(event) {

        if (event.target.classList.contains("control-button")) {

        const parentSection =
            event.target.closest(".input-section");

        if (parentSection) {

            const previousActive =
            parentSection.querySelector(".control-button.selected");

            if (previousActive) {
            previousActive.classList.remove("selected");
            }

            event.target.classList.add("selected");
        }
        }

    });


    // ---------------------------------------------------------
    // VANG / DOWNHAUL CONTROL FUNCTIONS
    // ---------------------------------------------------------

    function updateVangControl(vang) {

        window.globalSimulationData.ILCA.vang =
        vang;
    }


    function updateDownhaulControl(downhaul) {

        window.globalSimulationData.ILCA.downhaul =
        downhaul;
    }

    </script>

    <script src="js/practice-sail-trim.js"></script>
    <script src="js/input.js"></script>
</body>

</html>
