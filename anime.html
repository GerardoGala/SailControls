<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sail Tuning Simulator - Bootstrap Active State POC</title>
  
  <!-- 1. Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
 <!-- 2. Force the Open-Source Animation Engine to load first -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.0/anime.min.js"></script>
  
  <style>
    body {
      background-color: #f0f4f8;
    }
    .canvas-wrapper {
      height: 180px; 
      display: flex; 
      align-items: center; 
      justify-content: center;
    }
    /* Simple baseline style for all interactive trim nodes */
    .control-button {
      transition: all 0.2s ease-in-out;
    }
  </style>
</head>
<body>

  <div class="container my-4 bg-white p-4 rounded shadow-sm">
    <h2 class="mb-1 fw-bold text-dark">Sail Trim - Active State UI Matrix</h2>
    <p class="text-muted mb-4">Click any item. The tracking loop will paint the active button blue and restore others to white instantly.</p>

    <!-- HORIZONTAL SIDE-BY-SIDE SVGs -->
    <div id="sail-visualization-container" class="row g-3 mb-4">
      
      <!-- Section 1: Sail Shape Profile -->
      <div id="sailProfileDiv" class="col-md-6 text-center">
        <div class="border rounded p-3 bg-light">
          <h5 class="text-start text-secondary fw-semibold mb-2">&nbsp;Sail Shape Profile (Side View)</h5>
          <div class="canvas-wrapper bg-white rounded border border-light">
            <svg viewBox="0 0 200 160" width="100%" height="100%">
              <line id="mastLine" x1="50" y1="150" x2="65" y2="10" stroke="#4a5568" stroke-width="4" stroke-linecap="round" />
              <path id="sailProfilePath" d="M 50,145 Q 75,75 65,15" fill="none" stroke="#0d6efd" stroke-width="5" stroke-linecap="round"/>
              <line id="boomLine" x1="50" y1="145" x2="160" y2="145" stroke="#4a5568" stroke-width="3" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Section 2: Camber Cross-Section -->
      <div id="sailCamberDiv" class="col-md-6 text-center">
        <div class="border rounded p-3 bg-light">
          <h5 class="text-start text-secondary fw-semibold mb-2">&nbsp;Camber Cross-Section (Top-Down View)</h5>
          <div class="canvas-wrapper bg-white rounded border border-light">
            <svg viewBox="0 0 200 160" width="100%" height="100%">
              <line x1="20" y1="80" x2="180" y2="80" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="4,4" />
              <path id="sailCamberPath" d="M 20,80 Q 100,45 180,80" fill="none" stroke="#dc3545" stroke-width="5" stroke-linecap="round"/>
              <path id="foilReferencePath" d="M 100,80 L 100,135" stroke="#718096" stroke-width="4" stroke-linecap="round" />
              <text x="15" y="25" font-size="10" fill="#718096" class="user-select-none">Mast (Front)</text>
              <text x="145" y="25" font-size="10" fill="#718096" class="user-select-none">Clew (Back)</text>
            </svg>
          </div>
        </div>
      </div>

    </div>

    <!-- 1. MAINSHEET -->
    <div class="p-3 bg-light rounded border mb-3" data-control-group="mainsheet">
      <h6 class="fw-bold mb-2 text-secondary">MainSheet</h6>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-outline-primary control-button" onclick="updateBoomControl('0-8', this)">0° - 8°</button>
        <button class="btn btn-outline-primary control-button" onclick="updateBoomControl('5-15', this)">5° - 15°</button>
        <button class="btn btn-outline-primary control-button" onclick="updateBoomControl('35-65', this)">35° - 65°</button>
        <button class="btn btn-outline-primary control-button" onclick="updateBoomControl('40-70', this)">40° - 70°</button>
        <button class="btn btn-outline-primary control-button" onclick="updateBoomControl('75-85', this)">75° - 85°</button>
        <button class="btn btn-outline-primary control-button" onclick="updateBoomControl('90', this)">90°</button>
      </div>
    </div>

    <!-- 2. SAILOR POSITION -->
    <div class="p-3 bg-light rounded border mb-3" data-control-group="sailor">
      <h6 class="fw-bold mb-2 text-secondary">Sailor Position</h6>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-outline-primary control-button" onclick="updateSailorPosition('Forward', this)">Forward</button>
        <button class="btn btn-outline-primary control-button" onclick="updateSailorPosition('Hike Hard', this)">Hike Hard</button>
        <button class="btn btn-primary control-button" onclick="updateSailorPosition('Mid Center', this)">Mid Center</button>
        <button class="btn btn-outline-primary control-button" onclick="updateSailorPosition('Leeward', this)">Leeward</button>
        <button class="btn btn-outline-primary control-button" onclick="updateSailorPosition('Aft', this)">Aft</button>
      </div>
    </div>

    <!-- 3. DAGGERBOARD CONTROL -->
    <div class="p-3 bg-light rounded border mb-3" data-control-group="daggerboard">
      <h6 class="fw-bold mb-2 text-secondary">Daggerboard Control</h6>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-outline-primary control-button" onclick="updateDaggerboardControl('Up', this)">Up</button>
        <button class="btn btn-outline-primary control-button" onclick="updateDaggerboardControl('Center', this)">Center</button>
        <button class="btn btn-primary control-button" onclick="updateDaggerboardControl('Down', this)">Down</button>
      </div>
    </div>

    <!-- 4. VANG -->
    <div class="p-3 bg-light rounded border mb-3" data-control-group="vang">
      <h6 class="fw-bold mb-2 text-secondary">Vang</h6>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-outline-primary control-button" onclick="updateVangControl('Max', this)">MAX</button>
        <button class="btn btn-primary control-button" onclick="updateVangControl('Center', this)">CENTER</button>
        <button class="btn btn-outline-primary control-button" onclick="updateVangControl('Ease', this)">EASE</button>
      </div>
    </div>

    <!-- 5. DOWNHAUL -->
    <div class="p-3 bg-light rounded border mb-3" data-control-group="downhaul">
      <h6 class="fw-bold mb-2 text-secondary">Downhaul</h6>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-outline-primary control-button" onclick="updateDownhaulControl('Max Luff', this)">MAX LUFF</button>
        <button class="btn btn-primary control-button" onclick="updateDownhaulControl('Base', this)">BASE</button>
        <button class="btn btn-outline-primary control-button" onclick="updateDownhaulControl('Off', this)">OFF</button>
      </div>
    </div>

    <!-- 6. OUTHAUL -->
    <div class="p-3 bg-light rounded border mb-3" data-control-group="outhaul">
      <h6 class="fw-bold mb-2 text-secondary">Outhaul</h6>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-outline-primary control-button" onclick="updateOuthaulControl('Flat', this)">FLAT</button>
        <button class="btn btn-primary control-button" onclick="updateOuthaulControl('Base', this)">BASE</button>
        <button class="btn btn-outline-primary control-button" onclick="updateOuthaulControl('Full', this)">FULL</button>
      </div>
    </div>

  </div>

  <!-- 3. Dual UI/Vector Engine script configuration bindings -->
  <script src="js/input.js"></script>
  <script src="js/anime-sail-trim.js"></script>
</body>
</html>
