<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sail Controls | San Juan Academy</title>

<meta name="description" content="Learn, practice, and master dinghy sail controls. Understand what each control does, how it changes the sail, and when to use it.">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <style>
    body { 
      background-color: #f0f4f8; 
    }
    .tutorial-card { 
      max-width: 750px; 
      margin: 40px auto; 
    }
    /* FIX: Force an absolute bounded graphic workspace zone to stop clipping */
    .fixed-canvas-box { 
      height: 240px; 
      width: 100%;
      background: white; 
      border: 1px solid #dee2e6; 
      border-radius: 6px; 
      padding: 10px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-dot { 
      width: 12px; 
      height: 12px; 
      border-radius: 50%; 
      background-color: #cbd5e0; 
      display: inline-block; 
      margin: 0 4px; 
    }
    .step-dot.active { 
      background-color: #0d6efd; 
    }
  </style>
     	<!-- 2. Your Personal Custom CSS Last (Overrides everything above safely) -->
  	<link rel="stylesheet" href="css/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">

</head>
<body>
    <div style="background-color: var(--nav-bg); color: var(--text-color); padding: 1rem; border-radius: 4px;">
        <h2>San Juan Academy - Sail Controls</h2>
  </div>		
  <div class="container my-4" style="max-width: 850px;">
    <div class="card shadow-sm">
      <div class="card-header bg-primary  text-white p-3">
        <h5 class="m-0 fw-bold">Phase 2: Active Trim Practice Sandbox</h5>
      </div>
      
      <div class="card-body p-4">
        
        <!-- ======================================================== -->
        <!--  VISUALIZATION ZONE (DYNAMIC CANVAS MUTATION TRACK)      -->
        <!-- ======================================================== -->
        <div class="border rounded p-3 bg-light mb-4">
          
          <!-- VIEW A: Camber Cross-Section (Visible for Sheet & Outhaul) -->
          <div id="viewCamber" class="sandbox-view active-view">
            <h6 class="text-secondary fw-bold mb-2">Camber Cross-Section (Top-Down View)</h6>
            <div class="canvas-wrapper rounded border">
              <svg viewBox="0 0 200 160" width="50%" height="100%">
                <line x1="35" y1="80" x2="165" y2="80" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="4,4" />
                <!-- CORRECTED WIND INDICATOR: Blowing straight down from North (Top to Bottom) -->
                <g id="windArrowGroup">
                  <line x1="100" y1="5" x2="100" y2="25" stroke="#2b6cb0" stroke-width="5" stroke-linecap="round" />
                  <polygon points="94,17 100,28 106,17" fill="#2b6cb0" />
                  <text x="114" y="20" font-size="12" font-weight="bold" fill="#2b6cb0" style="user-select: none;">WIND</text>
                </g>

                <line id="topDownBoom" x1="50" y1="80" x2="148" y2="83" stroke="#4a5568" stroke-width="4" stroke-linecap="round" />
                <path id="sailCamberPath" d="M 50,80 Q 95,98 148,83" fill="none" stroke="#e53e3e" stroke-width="4" stroke-linecap="round"/>
                <circle cx="50" cy="80" r="5" fill="#4a5568" />
                <text x="35" y="102" font-size="10" fill="#718096">Mast</text>
                <text x="125" y="102" font-size="10" fill="#718096">Clew</text>
              </svg>
            </div>
          </div>

          <!-- VIEW B: Sailor Position Dual Tracker (Back & Side View) -->
          <div id="viewSailor" class="sandbox-view">
            <h6 class="text-secondary fw-bold mb-2">Sailor Position Layout (Transom & Bow Trim)</h6>
            <div class="canvas-wrapper rounded border" style="height: 180px; background: white; padding: 10px;">
              
              <!-- Unified isolated container for standalone layout bounding -->
              <div style="width: 100%; max-width: 320px; height: 100%; margin: 0 auto; position: relative;">
                <svg viewBox="0 0 200 160" width="100%" height="100%">
                  
                  <!-- ======================================================== -->
                  <!--  STATIC GRAPHIC ITEMS (These will NEVER tilt or rotate) -->
                  <!-- ======================================================== -->
                  <!-- HEAVY GALE WEST WIND INDICATOR (Blowing left-to-right onto the Port beam) -->
                  <g id="sailorWindGroup">
                    <line x1="15" y1="25" x2="55" y2="25" stroke="#2b6cb0" stroke-width="5" stroke-linecap="round" />
                    <polygon points="47,17 59,25 47,33" fill="#2b6cb0" />
                    <text x="15" y="14" font-size="12" font-weight="bold" fill="#2b6cb0" style="user-select: none;">HEAVY WIND</text>
                  </g>

                  <!-- STATIC CAPTIONS & INDICATORS -->
                  <text x="5" y="152" font-size="11" font-weight="bold" fill="#718096" style="user-select: none;">Port (Left)</text>
                  <text x="142" y="152" font-size="11" font-weight="bold" fill="#718096" style="user-select: none;">Starboard (Right)</text>
                  <text x="5" y="42" font-size="10" fill="#a0aec0" style="user-select: none;">Transom (Back View)</text>

                  <!-- ======================================================== -->
                  <!--  DYNAMIC TILTING SIMULATION GROUP (Targeted via ID)       -->
                  <!-- ======================================================== -->
                  <g id="tiltingRigGroup">
                    
                    <!-- ILCA Hull Profile (Transom View) -->
                    <polygon points="70,105 130,105 140,120 60,120" fill="#edf2f7" stroke="#4a5568" stroke-width="3" />
                    
                    <!-- Aluminum Rig Mast (Extends vertical from hull midpoint 100, 105) -->
                    <line x1="100" y1="105" x2="100" y2="30" stroke="#4a5568" stroke-width="4" stroke-linecap="round" />
                    
                    <!-- Stylized Sailor Stick Figure Crew Weight -->
                    <!-- Head -->
                    <circle id="crewHead" cx="100" cy="92" r="6" fill="#2d3748" />
                    <!-- Spine/Torso -->
                    <line id="crewBody" x1="100" y1="98" x2="100" y2="114" stroke="#2d3748" stroke-width="3" />
                  </g>

                </svg>
              </div>

            </div>
          </div>


          <!-- VIEW C: Rig Profile (Visible for Vang & Downhaul Mast Bending) -->
          <div id="viewRig" class="sandbox-view">
            <h6 class="text-secondary fw-bold mb-2">Rig Profile Tension (Side View Mast Bend)</h6>
            <div class="canvas-wrapper rounded border">
              <svg viewBox="0 0 200 160" width="50%" height="100%">
                <line x1="30" y1="145" x2="180" y2="145" stroke="#cbd5e0" stroke-width="2" />
                <!-- Mast Component (Targeted via Path for bending curves) -->
                <path id="mastProfilePath" d="M 50,145 Q 50,75 50,15" fill="none" stroke="#4a5568" stroke-width="4" stroke-linecap="round"/>
                <line id="profileBoomLine" x1="50" y1="125" x2="150" y2="125" stroke="#4a5568" stroke-width="3" />
                <path id="sailProfileCurvePath" d="M 50,125 Q 75,70 50,20" fill="none" stroke="#3182ce" stroke-width="4" stroke-linecap="round" />
              </svg>
            </div>
          </div>

        </div>

<!-- ======================================================== -->
<!--  MOBILE-FRIENDLY COMPACT CAROUSEL NAV HEADER             -->
<!-- ======================================================== -->
<div class="d-flex justify-content-between align-items-center bg-primary  text-white rounded p-2 mb-3 select-none">
  <!-- Left Arrow Button -->
  <button type="button" class="btn btn-dark fw-bold px-3 py-2 border-secondary" onclick="cycleSandboxTab(-1)">◄</button>
  
  <!-- Active Tab Label Text Display (Large, centered, and readable on mobile) -->
  <div class="text-center flex-grow-1">
    <span id="mobileTabLabel" class="fw-bold tracking-wide" style="font-size: 15px; letter-spacing: 0.5px;">Sheet & Outhaul</span>
  </div>
  
  <!-- Right Arrow Button -->
  <button type="button" class="btn btn-dark fw-bold px-3 py-2 border-secondary" onclick="cycleSandboxTab(1)">►</button>
</div>


        <!-- ======================================================== -->
        <!--  CONTROL INTERFACE INTERCEPT PANES                       -->
        <!-- ======================================================== -->
        <div id="input-pane">
          
          <!-- SUB-GROUP: MAINSHEET & OUTHAUL -->
          <div id="panel-sheet-outhaul" class="control-panel-group">
            <div class="mb-3">
              <label class="fw-bold text-dark mb-2">MainSheet (Boom Angle)</label>
              <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-primary" onclick="updateBoomControl('0-8', this)">0° - 8°</button>
                <button class="btn btn-outline-secondary" onclick="updateBoomControl('5-15', this)">5° - 15°</button>
                <button class="btn btn-outline-secondary" onclick="updateBoomControl('35-65', this)">35° - 65°</button>
                <button class="btn btn-outline-secondary" onclick="updateBoomControl('90', this)">90°</button>
              </div>
            </div>
            <div>
              <label class="fw-bold text-dark mb-2">Outhaul (Sail Fullness)</label>
              <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary" onclick="updateOuthaulControl('Flat', this)">FLAT</button>
                <button class="btn btn-primary" onclick="updateOuthaulControl('Base', this)">BASE</button>
                <button class="btn btn-outline-secondary" onclick="updateOuthaulControl('Full', this)">FULL</button>
              </div>
            </div>
          </div>

          <!-- SUB-GROUP: SAILOR POSITION -->
          <div id="panel-sailor" class="control-panel-group d-none">
            <div class="mb-3">
              <label class="fw-bold text-dark mb-2">Weight Distribution & Hiking Status</label>
              <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-outline-secondary" onclick="updateSailorPosition('Hike Hard', this)">Hike Hard</button>
                <button class="btn btn-primary" onclick="updateSailorPosition('Mid Center', this)">Mid Center</button>
                <button class="btn btn-outline-secondary" onclick="updateSailorPosition('Leeward', this)">Leeward</button>
              </div>
            </div>
          </div>

          <!-- SUB-GROUP: VANG & DOWNHAUL -->
          <div id="panel-vang-downhaul" class="control-panel-group d-none">
            <div class="mb-3">
              <label class="fw-bold text-dark mb-2">Vang (Leech Tension / Boom Downward Pull)</label>
              <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary" onclick="updateVangControl('Ease', this)">EASE</button>
                <button class="btn btn-primary" onclick="updateVangControl('Center', this)">CENTER</button>
                <button class="btn btn-outline-secondary" onclick="updateVangControl('Max', this)">MAX</button>
              </div>
            </div>
            <div>
              <label class="fw-bold text-dark mb-2">Downhaul (Luff Tension / Bottom Mast Bend)</label>
              <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary" onclick="updateDownhaulControl('Off', this)">OFF</button>
                <button class="btn btn-primary" onclick="updateDownhaulControl('Base', this)">BASE</button>
                <button class="btn btn-outline-secondary" onclick="updateDownhaulControl('Max Luff', this)">MAX LUFF</button>
              </div>
            </div>
          </div>

        </div>

      </div>
      
      <div class="card-footer bg-white p-3 border-top-0 text-start">
        <a href="learn.html" class="btn btn-outline-secondary">← Back to Learn Phase</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-top mt-5 py-1">
    <div class="container text-center">
    <p class="mb-1">
        <strong>Dinghy Sailing Tutorial</strong>
    </p>
    <small class="text-body-secondary">
        Learn • Practice • Challenge
    </small>
    </div>
  </footer>
  <script src="js/practice-sail-trim.js"></script>
</body>

</html>
